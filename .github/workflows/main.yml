name: Document core
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev clang libfontconfig1-dev unzip
      - run: cargo fmt --check
      - run: cargo check --locked --release
      - run: cargo test --locked --release
      # Native integration requires DomeD's BDF-patched FLTK. Run scripts/test-ui.py
      # on the suite build host; stock Ubuntu FLTK is not an equivalent text driver.
