[package]
name = "miro-pdf"
version = "0.12.0-dome.1"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0"
description = "Native FLTK PDF viewer for DomeD, Wayland and X11"
repository = "https://github.com/jebot-git/miro"
autobins = false

[lib]
name = "miro_backend"
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1.0.97"
home = "0.5.11"
mupdf = "=0.8.0"
num = "0.4.3"
regex = "1.12.3"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
strum = { version = "0.27.1", features = ["derive", "strum_macros"] }
twox-hash = { version = "2.1.1", features = ["serialize"] }

[profile.release]
codegen-units = 16
lto = false
strip = true
