# Miro FLTK / DomeD defaults. Super chords are owned by the compositor.
Bind Ctrl+o Normal OpenFileFinder
Bind Ctrl+w Normal CloseTab
Bind Ctrl+q Normal Exit
Bind Ctrl+s Normal SaveCopy
Bind Ctrl+p Normal PrintPdf
Bind Ctrl+f Normal OpenSearch
Bind F3 Normal NextSearchResult
Bind Shift+F3 Normal PreviousSearchResult
Bind / Normal OpenSearch
Bind n Normal NextSearchResult
Bind N Normal PreviousSearchResult
Bind p Normal PreviousSearchResult
Bind Ctrl+n Normal ToggleSearchMethod
Bind Escape Normal CloseSearch
Bind Ctrl+c Normal Copy
Bind Ctrl+a Normal SelectAll
Bind Ctrl+g Normal GoToPage
Bind Ctrl+r Normal Reload
Bind Ctrl+Tab Normal NextTab
Bind Ctrl+Shift+Tab Normal PreviousTab
Bind H Normal PreviousTab
Bind L Normal NextTab
Bind "Z Z" Normal CloseTab
Bind q Normal Exit
Bind j Normal MoveDown
Bind k Normal MoveUp
Bind h Normal MoveLeft
Bind l Normal MoveRight
Bind J Normal NextPage
Bind K Normal PreviousPage
Bind Up Normal MoveUp
Bind Down Normal MoveDown
Bind Left Normal MoveLeft
Bind Right Normal MoveRight
Bind PageDown Normal PageDown
Bind PageUp Normal PageUp
Bind Space Normal PageDown
Bind Shift+Space Normal PageUp
Bind Ctrl+d Normal HalfPageDown
Bind Ctrl+u Normal HalfPageUp
Bind Ctrl+b Normal AddBookmark
Bind Ctrl+Shift+b Normal ToggleSidebar
Bind Ctrl+i Normal ToggleDarkModeUi
Bind Ctrl+Shift+i Normal ToggleDarkModePdf
Bind Ctrl+k Normal TogglePageBorders
Bind Ctrl+l Normal ToggleLinkHitboxes
Bind Alt+Left Normal JumpBack
Bind Alt+Right Normal JumpForward
Bind 0 Normal ZoomHome
Bind _ Normal ZoomFitWidth
Bind Minus Normal ZoomOut
Bind Plus Normal ZoomIn
Bind Ctrl+0 Normal ZoomHome
Bind Ctrl+Minus Normal ZoomOut
Bind Ctrl+Plus Normal ZoomIn
Bind Ctrl+9 Normal ZoomFitWidth
Bind Ctrl+8 Normal ZoomFit
Bind F11 Normal ToggleFullscreen
Bind F10 Normal TogglePresentationMode
Bind Enter Normal ToggleOverviewMode
Bind Ctrl+1 Normal SinglePageLayout
Bind Ctrl+2 Normal DoublePageLayout
Bind Ctrl+3 Normal DoublePageTitlePageLayout
Bind [ Normal RotatePageCounterClockwise
Bind ] Normal RotatePageClockwise
Bind { Normal RotateAllPagesCounterClockwise
Bind } Normal RotateAllPagesClockwise
Bind F1 Normal Help
Bind Escape Presentation TogglePresentationMode
Bind F10 Presentation TogglePresentationMode
Bind F11 Presentation ToggleFullscreen
Bind j Presentation NextPage
Bind k Presentation PreviousPage
Bind Space Presentation NextPage
Bind Shift+Space Presentation PreviousPage
Bind PageDown Presentation NextPage
Bind PageUp Presentation PreviousPage
Bind Right Presentation NextPage
Bind Left Presentation PreviousPage
Bind Ctrl+o Presentation OpenFileFinder
Bind Ctrl+w Presentation CloseTab
Bind Ctrl+q Presentation Exit
Bind Escape Overview ToggleOverviewMode
Bind Enter Overview OverviewSelect
Bind j Overview NextPage
Bind k Overview PreviousPage
Bind Right Overview NextPage
Bind Left Overview PreviousPage
Bind Down Overview PageDown
Bind Up Overview PageUp
Bind Ctrl+o Overview OpenFileFinder
Bind Ctrl+w Overview CloseTab
Bind Ctrl+q Overview Exit
MouseBind MouseLeft Normal Panning
MouseBind Shift+MouseLeft Normal Selection
MouseBind MouseMiddle Normal Panning
MouseBind MouseBack Normal JumpBack
MouseBind MouseForward Normal JumpForward
MouseBind ScrollUp Normal MoveUp
MouseBind ScrollDown Normal MoveDown
MouseBind Ctrl+ScrollUp Normal ZoomIn
MouseBind Ctrl+ScrollDown Normal ZoomOut
MouseBind MouseLeft Presentation NextPage
MouseBind MouseRight Presentation PreviousPage
MouseBind MouseLeft Overview OverviewSelect
Set Rpc False
Set RpcPort 7890
Set RpcAllowLan False
Set TrackpadSensitivity 1.0
Set DarkModePdf True
Set DarkModeUi True
Set OpenSidebar False
Set PageBorders True
